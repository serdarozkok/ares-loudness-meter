[package]
name = "ares-loudness-meter"
version = "1.0.0"
description = "ARES Loudness Meter — System-wide real-time loudness, true-peak and phase meter"
authors = ["ARES Audio"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "loudmeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[example]]
name = "ipc_test_writer"
path = "examples/ipc_test_writer.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rustfft = "6"
symphonia = { version = "0.5", features = ["all"] }
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = { version = "0.8", features = ["ws"] }
local-ip-address = "0.6"
base64 = "0.22"
png = "0.17"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
] }

[target.'cfg(not(windows))'.dependencies]
cpal = "0.15"

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
